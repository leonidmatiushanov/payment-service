apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service-app
  labels:
    app: payment-service-app
spec:
  replicas: 1 # одно приложение (можно увеличить)
  selector:
    matchLabels:
      app: payment-service-app
  template:
    metadata:
      labels:
        app: payment-service-app
    spec:
      containers:
        - name: payment-service-app
          image: payment-service:latest # докер образ
          imagePullPolicy: IfNotPresent
          ports:
            - name: http # ДОБАВИТЬ ИМЯ К ПОРТУ
              containerPort: 8080 # порт внутри пода
            - name: mgmt
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /actuator/health/liveness # URL проверки старта
              port: mgmt # обращение к mgmt-порту
            periodSeconds: 5 # интервал между проверками
            failureThreshold: 60 # сколько подряд неудач допускается (5*60=~5 мин на старт)
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness # жив ли контейнер
              port: mgmt
            initialDelaySeconds: 10 # задержка перед первой проверкой
            periodSeconds: 10 # интервал между проверками
            timeoutSeconds: 2 # таймаут ожидания ответа
            failureThreshold: 3 # после 3 неудач контейнер перезапустится
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness # готов ли Pod принимать трафик
              port: mgmt
            initialDelaySeconds: 5 # задержка перед первой проверкой
            periodSeconds: 10 # интервал между проверками
            timeoutSeconds: 2 # таймаут ожидания ответа
            failureThreshold: 3 # после 3 неудач Pod исключается из сервиса
          env: # переменные окружения
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://my-pg-postgresql.db.svc.cluster.local:5432/payment-db
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: secret
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: my-kafka.kafka.svc.cluster.local:9092
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: http://keycloak.keycloak.svc.cluster.local:8080/realms/iprody-lms
            - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
              value: "http://zipkin.observability.svc.cluster.local:9411/api/v2/spans"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service-app
  labels:
    app: payment-service-app
spec:
  selector:
    app: payment-service-app
  ports:
    - protocol: TCP
      port: 8080 # порт внутри кластера
      targetPort: 8080 # порт контейнера
      nodePort: 30080 # внешний порт (только если type=NodePort)
  type: NodePort # вариант для доступа снаружи (Minikube, Docker Desktop)
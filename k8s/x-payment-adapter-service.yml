apiVersion: apps/v1
kind: Deployment
metadata:
  name: x-payment-adapter-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: x-payment-adapter-app
  template:
    metadata:
      labels:
        app: x-payment-adapter-app
    spec:
      containers:
        - name: x-payment-adapter-app
          image: x-payment-adapter-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http # ДОБАВИТЬ ИМЯ К ПОРТУ
              containerPort: 8080 # порт внутри пода
            - name: mgmt
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /actuator/health/liveness # URL проверки старта
              port: mgmt # обращение к mgmt-порту
            periodSeconds: 5 # интервал между проверками
            failureThreshold: 60 # сколько подряд неудач допускается (5*60=~5 мин на старт)
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness # жив ли контейнер
              port: mgmt
            initialDelaySeconds: 10 # задержка перед первой проверкой
            periodSeconds: 10 # интервал между проверками
            timeoutSeconds: 2 # таймаут ожидания ответа
            failureThreshold: 3 # после 3 неудач контейнер перезапустится
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness # готов ли Pod принимать трафик
              port: mgmt
            initialDelaySeconds: 5 # задержка перед первой проверкой
            periodSeconds: 10 # интервал между проверками
            timeoutSeconds: 2 # таймаут ожидания ответа
            failureThreshold: 3 # после 3 неудач Pod исключается из сервиса
          env:
          - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
            value: "my-kafka.kafka.svc.cluster.local:9093"
          - name: SPRING_KAFKA_CONSUMER_GROUP_ID
            value: "xpayment-adapter-result-consumers"
          - name: APP_KAFKA_TOPIC_REQUEST
            value: "xpayment-adapter.requests"
          - name: APP_KAFKA_TOPIC_RESPONSE
            value: "xpayment-adapter.responses"
          - name: RABBITMQ_URL
            value: "amqp://rabbitmq.rabbitmq.svc.cluster.local:5672"
          - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
            value: "http://zipkin.observability.svc.cluster.local:9411/api/v2/spans"

---
apiVersion: v1
kind: Service
metadata:
  name: x-payment-adapter-app
spec:
  selector:
    app: x-payment-adapter-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
server:
  port: 8080

spring:
  application:
    name: payment-service-app
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/iprody-lms
          jwk-set-uri: http://keycloak:8080/realms/iprody-lms/protocol/openid-connect/certs
  datasource: # объединяет в себе параметры подключения к БД
    url: jdbc:postgresql://localhost:5432/payment-db # URL подключения к БД
    username: admin # Имя пользователя
    password: secret # Пароль
    driver-class-name: org.postgresql.Driver # класс jdbc драйвера
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true # Показывать SQL-запросы в консоли
    properties:
      hibernate:
          format_sql: true # Форматировать SQL для читаемости
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: kafka:9092 #localhost 9093 было

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: xpayment-adapter-result-consumers
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: "com.iprody.leonidm.paymentserviceapp.async.XPaymentAdapterResponseMessage"

    listener:
      ack-mode: manual
      concurrency: 1
      observation-enabled: true
    template:
      observation-enabled: true

app:
  kafka:
    topics:
      x-payment-adapter:
        request: xpayment-adapter.requests
        response: xpayment-adapter.responses

logging:
  level:
    com.iprody.payment: DEBUG
    org.springframework.web: INFO
    org.springframework.data: INFO
    org.springframework.security: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
  tracing:
    sampling:
      probability: 1.0 # 100% для отладки; в продакшн должен быть меньше
    propagation:
      type: w3c,b3 # чтобы понимать и traceparent, и b3
    export:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans